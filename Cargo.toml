[package]
name = "project"
version = "0.1.0"
edition = "2024"
# rust-version = "1.74"                    # adjust to your actual MSRV
# description = "A two-tab Ratatui app (Todo + Messages) with versioned, event-logged persistence"
# license = "MIT"                          # change if you pick another
# readme = "README.md"
# repository = "https://github.com/<you>/<repo>"
# keywords = ["ratatui", "tui", "todo", "terminal"]
# categories = ["command-line-interface"]

[dependencies]
ratatui = { version = "0.29", features = ["unstable-widget-ref"] }
crossterm = "0.28"
color-eyre = "0.6"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
