[package]
name = "dortyuzlu"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.29"

[features]
default = []
# Switch these on when src/activity.rs and src/panel.rs are in place.
# The real panel also needs its own dependencies (axum, tokio, ...) added above.
activity = []
panel = []
