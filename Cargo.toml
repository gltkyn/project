[package]
name = "dortyuzlu"
version = "0.1.0"
edition = "2021"
default-run = "dortyuzlu"

[[bin]]
name = "dortyuzlu"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
