[package]
name = "life"
version = "0.1.0"
edition = "2021"
default-run = "life"

# src/main.rs      -> the TUI        (cargo run)
# src/bin/panel.rs -> browser panel  (cargo run --bin panel)

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ratatui = "0.29"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
